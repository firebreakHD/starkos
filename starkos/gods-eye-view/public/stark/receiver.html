<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02090c">
  <title>STARK RECEIVER</title>
  <link rel="stylesheet" href="./stark.css">
</head>
<body class="receiver-screen">
  <main class="receiver-shell">
    <header><span>STARK <b>OS</b></span><em id="receiverState">AWAITING PAIR</em></header>
    <form id="pairForm" class="pair-form">
      <small>AUTHORIZED DISPLAY LINK</small>
      <h1>RECEIVER</h1>
      <p>Gib den sechsstelligen Code ein, der auf deinem STARK-OS-Gerät angezeigt wird.</p>
      <input id="pairCode" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required autofocus>
      <button type="submit">DISPLAY KOPPELN</button>
      <output id="pairError"></output>
    </form>
    <section id="receiveStage" class="receive-stage" hidden>
      <div class="receiver-orbit"><i></i><i></i><i></i><strong>LINK</strong></div>
      <p>VERBINDUNG BEREIT</p>
    </section>
  </main>
  <script type="module" src="./receiver.js"></script>
</body>
</html>
