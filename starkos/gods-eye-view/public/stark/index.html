<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
    />
    <meta name="theme-color" content="#02090c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>STARK OS</title>
    <link rel="stylesheet" href="./stark.css" />
  </head>
  <body>
    <div class="boot-noise" aria-hidden="true"></div>
    <main class="device" id="device">
      <header class="telemetry" aria-label="Systemstatus">
        <span class="mark">STARK<small>OS</small></span>
        <span id="clock">00:00:00</span>
        <span class="status"><i></i> LOCAL</span>
      </header>

      <section class="stage" aria-label="STARK OS Medienring">
        <div class="reticle" aria-hidden="true"><i></i><i></i><i></i></div>
        <div
          class="ring"
          id="ring"
          role="listbox"
          aria-label="Funktionsring"
        ></div>
        <button class="core" id="core" type="button" aria-live="polite">
          <span class="core-index" id="coreIndex">01 / 05</span>
          <span class="core-glyph" id="coreGlyph">◉</span>
          <strong id="coreTitle">MEDIA</strong>
          <span id="coreDetail">Eigene Bilder und Videos untersuchen</span>
          <em>DOPPELTIPP ZUM ÖFFNEN</em>
        </button>
      </section>

      <footer class="readout">
        <span id="hint">RING DREHEN · AUSWAHL EINRASTEN</span>
        <span class="coordinates">48.2082° N&nbsp;&nbsp;16.3738° E</span>
      </footer>
    </main>

    <section class="panel" id="panel" aria-hidden="true">
      <header>
        <button id="closePanel" type="button" aria-label="Schließen">×</button>
        <div>
          <small id="panelCode">MODULE 01</small>
          <h1 id="panelTitle">MEDIA</h1>
        </div>
        <span class="pulse"></span>
      </header>
      <div class="panel-body" id="panelBody"></div>
    </section>

    <template id="mediaTemplate">
      <div class="module media-module">
        <section
          class="stark-browser"
          id="starkBrowser"
          data-view="folders"
          data-orientation="portrait"
          aria-label="Medienbrowser"
          data-mode="manual"
        >
          <div class="browser-top" id="browserTop" aria-live="polite">
            <span class="top-receiver" data-online="no" id="receiverChip"
              ><i aria-hidden="true"></i
              ><strong id="receiverName">KEIN RECEIVER</strong></span
            >
            <span class="top-shown">
              <img id="receiverThumb" alt="" hidden /><b id="receiverMedia">—</b
              ><em id="receiverZoom" hidden></em>
            </span>
            <span class="top-state" id="receiverState">NICHT VERBUNDEN</span>
          </div>
          <div class="browser-stage" id="browserStage">
            <div class="browser-primary">
              <div class="folder-stack" id="folderStack" aria-live="polite">
                <span
                  class="folder-name is-previous"
                  id="folderPrevious"
                ></span>
                <strong class="folder-name is-current" id="folderCurrent"
                  >…</strong
                >
                <span class="folder-name is-next" id="folderNext"></span>
              </div>
              <div class="preview-stack" id="previewStack" hidden>
                <div class="preview-frame" id="previewFrame">
                  <div class="preview-canvas" id="previewCanvas"></div>
                </div>
                <div class="preview-meta">
                  <button
                    type="button"
                    class="browser-back"
                    id="browserBack"
                    aria-label="Zurück zur Ordnerauswahl"
                  >
                    ‹
                  </button>
                  <button
                    type="button"
                    class="browser-transfer"
                    id="browserTransfer"
                    title="Datei übertragen, nicht präsentieren"
                  >
                    DATEI
                  </button>
                </div>
              </div>
            </div>
            <div
              class="browser-wheel"
              id="browserWheel"
              role="group"
              tabindex="0"
              aria-label="Auswahlrad"
            >
              <div class="wheel-dial" id="wheelDial">
                <div class="wheel-decor" aria-hidden="true">
                  <i class="wheel-ticks"></i><i class="wheel-spokes"></i
                  ><i class="wheel-inner"></i>
                </div>
                <div class="wheel-segments" id="wheelSegments"></div>
                <svg
                  class="wheel-marker"
                  id="wheelMarker"
                  viewBox="0 0 100 100"
                  aria-hidden="true"
                  hidden
                >
                  <path d="M39 8.5 L61 8.5 L56.49 25.5 L43.51 25.5 Z" />
                </svg>
                <button
                  type="button"
                  class="wheel-core"
                  id="wheelCore"
                  aria-label="Ordner laden"
                >
                  <span class="core-mode" aria-hidden="true">
                    <svg class="mode-manual" viewBox="0 0 24 24">
                      <path
                        d="M8.5 13.2V6.4a1.4 1.4 0 0 1 2.8 0v4.6m0-5.2a1.4 1.4 0 0 1 2.8 0v5.2m0-3.6a1.4 1.4 0 0 1 2.8 0v6.9a5.8 5.8 0 0 1-5.8 5.8h-.8a4.8 4.8 0 0 1-4-2.2l-2-3a1.5 1.5 0 0 1 2.4-1.8l1.8 2"
                      />
                    </svg>
                    <svg class="mode-auto" viewBox="0 0 24 24">
                      <path d="M4 9.2h13.4m-3.2-3.4 3.4 3.4-3.4 3.4" />
                      <path d="M20 15.2H6.6m3.2-3.4-3.4 3.4 3.4 3.4" />
                    </svg>
                  </span>
                </button>
              </div>
            </div>
          </div>
          <output class="browser-status" id="browserStatus"></output>
        </section>
        <section class="media-sources" id="mediaSources" hidden>
          <header>
            <strong>MEDIENBROWSER</strong
            ><button type="button" id="closeSources">×</button>
          </header>
          <div class="media-source-actions">
            <span>ORDNER WÄHLEN · WHEEL DREHEN · LOAD</span>
            <button type="button" id="toggleSourceSettings">
              NAS EINSTELLUNGEN
            </button>
          </div>
          <div class="media-toolbar">
            <button type="button" id="pickMedia">＋ DATEI</button>
            <span>DROP</span>
            <input
              type="file"
              id="mediaInput"
              accept="image/*,video/*,.pdf"
              multiple
              hidden
            />
          </div>
          <details class="web-media compact-web">
            <summary>＋ WEBLINK</summary>
            <form id="webMedia">
              <input
                type="url"
                id="webUrl"
                placeholder="https://…"
                required
              /><button type="submit">HINZUFÜGEN</button>
            </form>
          </details>
          <form id="sourceForm" autocomplete="off" hidden>
            <input
              id="sourceName"
              placeholder="NAME · z. B. NAS WOHNZIMMER"
              maxlength="80"
              required
            />
            <select id="sourceType" aria-label="Protokoll">
              <option value="webdav">WEBDAV</option>
              <option value="smb" disabled>
                SMB · HARDWARETEST AUSSTEHEND
              </option>
            </select>
            <input
              id="sourceUrl"
              type="url"
              placeholder="https://nas.example/dav/"
              required
            />
            <input
              id="sourceUser"
              autocomplete="username"
              placeholder="BENUTZER"
            />
            <input
              id="sourcePassword"
              type="password"
              autocomplete="new-password"
              placeholder="PASSWORT"
            />
            <button type="submit">QUELLE SPEICHERN</button>
            <output id="sourceStatus"></output>
          </form>
          <div class="source-list" id="sourceList"></div>
        </section>
      </div>
    </template>

    <template id="investigationTemplate">
      <div class="module investigation-module">
        <div class="case-head">
          <span>CASE // LOCAL</span
          ><button id="saveCase" type="button">PROJEKT SICHERN</button>
        </div>
        <div class="evidence-field" id="evidenceField">
          <button class="evidence-node primary" style="--x: 50%; --y: 45%">
            <b>+</b><span>MEDIUM</span>
          </button>
          <button class="evidence-node" style="--x: 20%; --y: 22%">
            <b>◈</b><span>ORT</span>
          </button>
          <button class="evidence-node" style="--x: 79%; --y: 26%">
            <b>⌁</b><span>EREIGNIS</span>
          </button>
          <button class="evidence-node" style="--x: 72%; --y: 77%">
            <b>▤</b><span>DOKUMENT</span>
          </button>
          <svg
            aria-hidden="true"
            viewBox="0 0 100 100"
            preserveAspectRatio="none"
          >
            <path d="M50 45 L20 22 M50 45 L79 26 M50 45 L72 77" />
          </svg>
        </div>
        <p class="module-note">
          Objekte direkt verschieben. Projekte werden lokal auf diesem Gerät
          gespeichert.
        </p>
      </div>
    </template>

    <template id="receiverTemplate">
      <div class="module receiver-module">
        <div class="receiver-orbit">
          <i></i><i></i><i></i><strong>LINK</strong>
        </div>
        <h2>DISPLAY CONNECT</h2>
        <p>
          Öffne <b id="receiverUrl">/stark/receiver.html</b> auf deinem eigenen
          Bildschirm. Neue Displays erscheinen automatisch und können nur hier
          am Handy verbunden werden.
        </p>
        <div class="receiver-list" id="receiverList"></div>
        <button type="button" id="endAll">ALLE PRÄSENTATIONEN BEENDEN</button>
        <section class="capture-planned">
          <strong>BILDSCHIRM / FENSTER</strong
          ><span
            >Separater WebRTC-Bereich vorgesehen; erst nach bestätigter Freigabe
            und sicherem Signaling aktiv.</span
          ><button type="button" disabled>NOCH NICHT VERFÜGBAR</button>
        </section>
      </div>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
