name: STARK OS
slug: starkos
description: Mobile-first research, media and geospatial interface powered by God's Eye View.
version: "0.4.0"
stage: experimental
startup: services
boot: auto
init: false
ingress: true
ingress_port: 4173
ingress_stream: true
ingress_entry: /stark/
panel_title: STARK OS
panel_icon: mdi:orbit
panel_admin: false
arch:
  - amd64
  - aarch64
ports:
  4173/tcp: 8788
  8443/tcp: 8789
ports_description:
  4173/tcp: Passive receiver HTTP access
  8443/tcp: Optional HTTPS controller (enable SSL and set a password)
webui: http://[HOST]:[PORT:4173]/stark/
watchdog: http://[HOST]:[PORT:4173]/api/stark/health
map:
  - data:rw
  - ssl:ro
options:
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
  https_password: ""
  codex_model: ""
  searxng_url: ""
  google_maps_api_key: ""
  google_maps_server_api_key: ""
  cesium_ion_token: ""
  mapillary_client_token: ""
  opensky_client_id: ""
  opensky_client_secret: ""
  aisstream_api_key: ""
  tomtom_api_key: ""
  ll2_api_token: ""
schema:
  ssl: bool
  certfile: str
  keyfile: str
  https_password: password
  codex_model: str
  searxng_url: str
  google_maps_api_key: password
  google_maps_server_api_key: password
  cesium_ion_token: password
  mapillary_client_token: password
  opensky_client_id: str
  opensky_client_secret: password
  aisstream_api_key: password
  tomtom_api_key: password
  ll2_api_token: password
